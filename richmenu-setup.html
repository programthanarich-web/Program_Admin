<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติดตั้งเมนูแอดมิน</title>
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --ink:#101828; --sub:#667085; --line:#e4e7ec; --blue:#0b5cad; --red:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f141c; --card:#171d27; --ink:#eef2f7; --sub:#98a2b3; --line:#2a3341; --blue:#4d9bff; --red:#ff8a80; --ok:#6ce9a6; }
  }
  :root[data-theme="dark"] { --bg:#0f141c; --card:#171d27; --ink:#eef2f7; --sub:#98a2b3; --line:#2a3341; --blue:#4d9bff; --red:#ff8a80; --ok:#6ce9a6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display:block; font-size: 14px; color: var(--sub); margin: 12px 0 6px; }
  input[type=text], input[type=password] { width:100%; padding: 12px; border:1px solid var(--line); border-radius: 10px; font-size: 16px; background: transparent; color: var(--ink); }
  input[type=file] { font-size: 15px; }
  img.prev { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--line); display: none; }
  .btns { display:flex; gap:10px; margin-top: 14px; flex-wrap: wrap; }
  button { flex:1; min-width: 150px; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; color:#fff; background: var(--blue); }
  button.ghost { background: transparent; color: var(--red); border: 1px solid var(--red); }
  button:disabled { opacity: .5; cursor: default; }
  #result { margin-top: 12px; font-size: 15px; line-height: 1.6; white-space: pre-line; }
  .ok { color: var(--ok); } .err { color: var(--red); }
  .note { font-size: 13px; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ติดตั้งเมนูแอดมิน (LINE OA)</h1>

  <div class="card">
    <p class="note">เมนูนี้จะแสดงเฉพาะบัญชีแอดมินที่ตั้งไว้ในหลังบ้าน ลูกค้าจะไม่เห็นและเมนูลูกค้าจะไม่เปลี่ยนแปลง</p>

    <label for="pw">รหัสแอดมิน</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่านหลังบ้าน">

    <label for="img">รูปเมนูแอดมิน (PNG หรือ JPEG ไม่เกิน 1 MB)</label>
    <input id="img" type="file" accept="image/png,image/jpeg">
    <img id="prev" class="prev" alt="ตัวอย่างเมนู">

    <label for="url">ลิงก์หน้าหลังบ้าน</label>
    <input id="url" type="text" value="https://programthanarich-web.github.io/Program_Admin/">

    <div class="btns">
      <button id="install">ติดตั้งเมนูแอดมิน</button>
      <button id="remove" class="ghost">ถอนเมนูแอดมิน</button>
    </div>
    <div id="result"></div>
  </div>
</div>

<script>
const API_BASE = "https://program-api.programthanarich.workers.dev";
const $ = id => document.getElementById(id);

$("img").addEventListener("change", () => {
  const f = $("img").files[0];
  if (!f) { $("prev").style.display = "none"; return; }
  $("prev").src = URL.createObjectURL(f);
  $("prev").style.display = "block";
});

function show(msg, ok) {
  $("result").className = ok ? "ok" : "err";
  $("result").textContent = msg;
}

function setBusy(busy) {
  $("install").disabled = busy;
  $("remove").disabled = busy;
}

async function call(path, body) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Authorization": "Bearer " + $("pw").value },
    body
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Error("รหัสแอดมินไม่ถูกต้อง");
  if (!res.ok) throw new Error(data.error || ("เกิดข้อผิดพลาด (รหัส " + res.status + ")"));
  return data;
}

$("install").addEventListener("click", async () => {
  const f = $("img").files[0];
  if (!$("pw").value) return show("กรุณาใส่รหัสแอดมิน", false);
  if (!f) return show("กรุณาเลือกไฟล์รูปเมนู", false);
  const fd = new FormData();
  fd.append("file", f);
  fd.append("adminUrl", $("url").value.trim());
  setBusy(true);
  show("กำลังติดตั้ง...", true);
  try {
    const d = await call("/admin/richmenu/setup", fd);
    show("ติดตั้งเสร็จแล้ว\nผูกกับแอดมิน " + d.linked + " / " + d.total + " บัญชี\nลบเมนูเก่า " + d.replaced + " รายการ\nลูกค้ายังเห็นเมนูเดิมตามปกติ", true);
  } catch (e) {
    show(e.message, false);
  } finally {
    setBusy(false);
  }
});

$("remove").addEventListener("click", async () => {
  if (!$("pw").value) return show("กรุณาใส่รหัสแอดมิน", false);
  if (!confirm("ถอนเมนูแอดมินออกจากทุกบัญชีแอดมิน?")) return;
  setBusy(true);
  try {
    const d = await call("/admin/richmenu/remove", new FormData());
    show("ถอนเมนูแอดมินแล้ว " + d.removed + " รายการ", true);
  } catch (e) {
    show(e.message, false);
  } finally {
    setBusy(false);
  }
});
</script>
</body>
</html>
