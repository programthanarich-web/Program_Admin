<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06C755">
<title>หลังบ้าน | ProgramThanarich</title>
<style>
  :root{--blue:#0b5ed7;--blue-d:#084bb0;--bg:#f3f6fb;--card:#fff;--text:#0f1b33;--muted:#6b7a90;--line:#e3e9f3;--ok:#12a150;--err:#d93434;--amber:#b26a00;--yellow:#ffc233}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px;font-size:13px;color:var(--text);font-weight:600}
  button:hover{filter:brightness(.97)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.primary:hover{background:var(--blue-d)}
  button.danger{color:var(--err);border-color:#f3c4c4;background:#fff5f5}
  button.ok{color:var(--ok);border-color:#bfe7cf;background:#f1fbf5}
  button.ghost{background:#f4f7fc}
  input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:2px solid #8cb8ff;border-color:transparent}
  input[type=file]{padding:6px;font-size:13px}
  label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--text)}
  .hidden{display:none !important}
  .brand{font-weight:800;color:var(--blue);font-size:16px}
  .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(16,40,80,.06);margin-bottom:14px}
  .card h3{font-size:16px;margin-bottom:4px}
  .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .err{color:var(--err);font-size:13px;margin:8px 0;display:none}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .grid4 button{height:38px}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
  .login-card button{padding:11px}

  /* top bar */
  .top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .dirty{font-size:12px;color:var(--amber);margin-right:6px}
  .tabs{background:#fff;display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 10px;color:var(--muted);white-space:nowrap}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
  .tabs .count{background:#e2e8f0;border-radius:99px;padding:0 7px;font-size:11px;margin-left:4px}
  .tabs .count.hot{background:var(--err);color:#fff}
  main{max-width:1000px;margin:0 auto;padding:20px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(16,40,80,.06)}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:22px;font-weight:800;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:18px}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
  .bars .b i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px;position:relative}
  .bars .b i b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--text)}
  .branch{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .branch:last-child{border-bottom:0}

  /* orders */
  .order{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .order .top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .order .meta{color:var(--muted);font-size:12.5px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e8f9ef;color:#0a7a3a}
  .pill.new{background:#fff4dd;color:var(--amber)}
  .pill.rejected{background:#fde8ea;color:var(--err)}
  .order .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .empty{text-align:center;padding:24px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:700;background:#f8fafd}
  .table-wrap{overflow-x:auto}

  /* packages & samples */
  .sample-row{display:grid;grid-template-columns:160px 1fr;gap:14px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
  .thumb{aspect-ratio:16/10;background:#eef3fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden;text-align:center;padding:6px}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .fields{display:flex;flex-direction:column;gap:10px}
  .btns-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .qr-preview{width:160px;height:160px;border-radius:10px;background:#eef3fa;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;margin-top:8px}
  .qr-preview img{width:100%;height:100%;object-fit:contain}
  .photo{border:1px dashed #b9c4d2;border-radius:12px;padding:12px;text-align:center}
  .photo .t{font-weight:700;font-size:13px;margin-bottom:8px}
  .photo .ph{aspect-ratio:16/10;background:#f5f7fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin-bottom:8px;overflow:hidden}
  .photo .ph img{width:100%;height:100%;object-fit:cover}
  .danger-zone{border:1px solid #f2c3c9;background:#fff5f6;border-radius:14px;padding:18px}
  .danger-zone h3{color:var(--err)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1b33;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;font-size:13px;z-index:50;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--ok)}
  .toast.bad{background:var(--err)}

  @media (max-width:720px){
    .stats{grid-template-columns:1fr 1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .grid4 button{grid-column:span 2}
    .sample-row{grid-template-columns:1fr}
  }
  /* ----- คูปองสำหรับพิมพ์ A4 (4 คูปองต่อ 1 แผ่น) ----- */
  #printArea{display:none}
  .cp{display:flex;align-items:stretch;width:190mm;height:64mm;margin:0 0 4mm;border:1px dashed #666;border-radius:4mm;overflow:hidden;background:#fff;color:#111;box-sizing:border-box}
  .cp-amt{width:48mm;background:#0b5cad;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4mm;text-align:center}
  .cp-head{font-size:10pt;font-weight:700;line-height:1.25;margin-bottom:2mm}
  .cp-val{font-size:34pt;font-weight:800;line-height:1}
  .cp-val small{font-size:12pt}
  .cp-label{font-size:9pt;margin-top:2mm}
  .cp-logo{max-height:10mm;max-width:30mm;margin-bottom:2mm;background:#fff;border-radius:2mm;padding:1mm}
  .cp-code{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4mm}
  .cp-cap{font-size:9pt;color:#555}
  .cp-num{font-family:monospace;font-size:24pt;font-weight:700;letter-spacing:1.5mm;margin-top:1mm}
  .cp-terms{width:58mm;font-size:8.5pt;padding:4mm;display:flex;flex-direction:column;justify-content:center;gap:1.5mm;border-left:1px dashed #999}
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{display:block;position:absolute;left:0;top:0;width:190mm}
    .cp{break-inside:avoid}
    .cp:nth-child(4n):not(:last-child){break-after:page}
    @page{size:A4;margin:10mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<!-- ============ เข้าสู่ระบบ ============ -->
<div id="login" class="login hidden">
  <form class="card login-card" onsubmit="login(event)">
    <div class="brand">ProgramThanarich · หลังบ้าน</div>
    <label>รหัสผู้ดูแล
      <input id="token" type="password" autocomplete="current-password" required>
    </label>
    <div class="err" id="loginErr">เข้าสู่ระบบไม่สำเร็จ ตรวจสอบรหัสผู้ดูแลหรือการเชื่อมต่อ</div>
    <button class="primary" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>

<!-- ============ แดชบอร์ด ============ -->
<div id="dash" class="hidden">
  <header class="top">
    <div class="brand">ProgramThanarich · หลังบ้าน</div>
    <div class="actions">
      <span class="dirty" id="dirtyTag"></span>
      <button class="primary" id="saveBtn" onclick="saveAll()">บันทึกการตั้งค่า</button>
      <button class="ghost" onclick="logout()">ออกจากระบบ</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>
</div>

<div id="toast" class="toast"></div>

<script>
/* ==========================================================
   ตั้งค่า: URL ของ Cloudflare Worker (หลังบ้าน API)
   ========================================================== */
// URL ของ Worker (หลังบ้านกลาง) — แทน programthanarich ด้วยชื่อบัญชี Cloudflare ของคุณ
const API_BASE = "https://program-api.programthanarich.workers.dev";

/*  API ที่ Worker ต้องมี (ทุกเส้นต้องมี Authorization: Bearer <รหัสผู้ดูแล>)
    GET    /admin/settings          → ค่าการตั้งค่าทั้งหมด (รูปแบบด้านล่าง)
    PUT    /admin/settings          → บันทึกค่าการตั้งค่าทั้งหมด (JSON)
    POST   /admin/upload            → อัปโหลดรูป (multipart field "file") คืน { "url": "..." }
    GET    /admin/orders            → รายการสั่งซื้อ [{ id, orderNo, createdAt, phone, serial, package, amount, status, branch }]
    POST   /admin/orders/:id        → เปลี่ยนสถานะ { "status": "confirmed" | "done" | "rejected" }
    DELETE /admin/history           → ลบประวัติทั้งหมด body { "password": "..." }
    GET    /settings                → (สาธารณะ) ให้หน้าบ้านดึงค่าไปใช้

    รูปแบบ settings:
    {
      DISCOUNT_SHOP, QR_IMAGE_URL,
      PACKAGES: [{ id, name, price, code }],
      SELF_STEPS: [ "ขั้นตอน..." ],
      SIM_SAMPLE_IMAGES: [{ url, caption }],
      channels: [{ name, url }],
      trackingHelp, simHelp,
      photos: { orderShot, simEnvelope, registerOk, simNumberEx, trackingEx, receivedPhoneEx },
      rejectMessages: [ "..." ],
      messages: { confirm, done }
    }
*/

const MENU_TEXT_DEFAULT = {
  menuTitle: "สมัครแพ็กเกจเน็ต",
  selfTitle: "เติมเงินสมัครเน็ตเอง",
  selfDesc: "เติมเงินและสมัครด้วยตัวเอง",
  shopTitle: "สมัครเน็ตกับทางร้าน",
  shopDesc: "ชำระผ่านสลิป ตรวจสอบอัตโนมัติ"
};

let token = sessionStorage.getItem("adm_token") || "";
let settings = null;
let orders = [];
let tab = "packages";

const TABS = [
  ["packages", "แพ็กเกจ & ขั้นตอน"],
  ["lucky", "เบอร์มงคล"],
  ["luckyrules", "ตารางวิเคราะห์เบอร์"],
  ["shop", "ส่วนลด & QR"],
  ["orders", "รายการสั่งซื้อ"],
  ["coupons", "คูปองส่วนลด"],
  ["stock", "สต๊อกซิม"],
  ["settings", "การตั้งค่า"],
  ["danger", "ลบประวัติ"]
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = n => "฿" + (Number(n) || 0).toLocaleString("th-TH");
const pkgName = o => (o.package && o.package.name) || o.package || "";
const dayOf = o => new Date(o.createdAt || o.time);

function toast(msg, ok = true) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (ok ? "ok" : "bad");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = "toast", 2400);
}

function normalize(s) {
  return {
    DISCOUNT_SHOP: 0,
    QR_IMAGE_URL: "",
    ...s,
    PACKAGES: s.PACKAGES || [],
    luckyNumbers: s.luckyNumbers || [],
    carrierLogos: s.carrierLogos || {},
    carrierRegister: s.carrierRegister || {},
    menuIcons: s.menuIcons || {},
    quickMenu: s.quickMenu || {},
    heroImage: "",
    banners: s.banners || [],
    luckyRules: s.luckyRules || structuredClone(DEFAULT_LUCKY_RULES),
    SELF_STEPS: s.SELF_STEPS || [],
    SELF_STEPS_BY: s.SELF_STEPS_BY || {},
    month2Carriers: s.month2Carriers || {},
    month2Samples: s.month2Samples || {},
    simAgeCarriers: s.simAgeCarriers || {},
    simAgeSamples: s.simAgeSamples || {},
    portOtpSample: s.portOtpSample || "",
    SIM_SAMPLE_IMAGES: s.SIM_SAMPLE_IMAGES || [],
    channels: s.channels || [],
    menuTexts: { ...MENU_TEXT_DEFAULT, ...(s.menuTexts || {}) },
    trackingHelp: s.trackingHelp || "",
    simHelp: s.simHelp || "",
    photos: s.photos || {},
    rejectMessages: s.rejectMessages || [],
    messages: { confirm: "", done: "", ...(s.messages || {}) }
  };
}

async function api(path, opts = {}) {
  const headers = { Authorization: "Bearer " + token };
  let body = opts.body;
  if (opts.json !== undefined) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(opts.json);
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { method: opts.method || "GET", headers, body });
  } catch (e) {
    throw new Error("เชื่อมต่อหลังบ้าน (Worker) ไม่ได้");
  }
  if (res.status === 401) throw new Error("รหัสไม่ผ่านการยืนยัน (401) ตรวจสอบรหัสผู้ดูแล หรือ Deploy Worker ล่าสุด");
  if (!res.ok) throw new Error("เซิร์ฟเวอร์ตอบกลับผิดปกติ (HTTP " + res.status + ")");
  return res.json();
}

/* ==========================================================
   เข้าสู่ระบบ
   ========================================================== */
async function login(e) {
  e.preventDefault();
  const input = $("token").value.trim();
  if (!input) return;
  token = input;
  try {
    settings = normalize(await api("/admin/settings"));
    sessionStorage.setItem("adm_token", token);
    showDash();
    loadOrders(true);
  } catch (err) {
    token = "";
    $("loginErr").style.display = "block";
  }
}

function logout() {
  token = "";
  settings = null;
  sessionStorage.removeItem("adm_token");
  $("dash").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("token").value = "";
  $("loginErr").style.display = "none";
}

function showDash() {
  $("login").classList.add("hidden");
  $("dash").classList.remove("hidden");
  render();
}

function markDirty() {
  $("dirtyTag").textContent = "มีการเปลี่ยนแปลงที่ยังไม่บันทึก";
}

async function runMigrate() {
  try {
    const r = await api("/admin/migrate", { method: "POST", json: {} });
    toast(r.message || "อัปเดตฐานข้อมูลแล้ว");
  } catch (e) {
    toast("อัปเดตไม่สำเร็จ: " + e.message, false);
  }
}

// เปิด/ปิดการตรวจสลิป แล้วบันทึกทันที (ใช้กับทุกเครื่องที่เปิดหลังบ้าน)
async function setSlipCheck(on) {
  if (!on && !confirm("ปิดการตรวจสลิป? ลูกค้าจะสั่งซื้อได้โดยไม่ต้องจ่ายจริง ควรเปิดกลับหลังทดสอบเสร็จ")) {
    $("content").innerHTML = viewSettings();
    return;
  }
  settings.SLIP_CHECK = on;
  markDirty();
  await saveAll();
  $("content").innerHTML = viewSettings();
}

/* ==========================================================
   แท็บ & การแสดงผล
   ========================================================== */
function renderTabs() {
  const pending = orders.filter(o => o.status === "new").length;
  $("tabs").innerHTML = TABS.map(([key, label]) => `
    <button class="${key === tab ? "on" : ""}" onclick="setTab('${key}')">
      ${label}${key === "orders" && pending ? ` <span class="count hot">${pending}</span>` : ""}
    </button>`).join("");
}

function setTab(t) {
  tab = t;
  if (t === "orders") { loadOrders(); return; }
  if (t === "coupons") { loadCoupons(); return; }
  if (t === "stock") { renderTabs(); loadStock(); return; }
  render();
}

function render() {
  renderTabs();
  const views = {
    packages: viewPackages, lucky: viewLucky, luckyrules: viewLuckyRules, shop: viewShop,
    orders: viewOrders, settings: viewSettings, danger: viewDanger, coupons: viewCoupons,
    stock: viewStock
  };
  $("content").innerHTML = (views[tab] || viewPackages)();
}

/* ==========================================================
   แพ็กเกจ & ขั้นตอน
   ========================================================== */
// ค่าตั้งต้นของตารางวิเคราะห์เบอร์ (แก้ไขได้ในหน้านี้)
const DEFAULT_LUCKY_RULES = {
  digits: [
    { d: "0", name: "ศูนย์", mean: "ความว่าง การเริ่มต้นใหม่ ไร้ขีดจำกัด" },
    { d: "1", name: "หนึ่ง", mean: "ความเป็นผู้นำ ความก้าวหน้า การเริ่มต้น" },
    { d: "2", name: "สอง", mean: "ความรัก ความสัมพันธ์ ความร่วมมือ" },
    { d: "3", name: "สาม", mean: "ความเจริญรุ่งเรือง การเติบโต การค้าขาย" },
    { d: "4", name: "สี่", mean: "ความมั่นคง ความหนักแน่น" },
    { d: "5", name: "ห้า", mean: "การเปลี่ยนแปลง ความคล่องตัว การสื่อสาร" },
    { d: "6", name: "หก", mean: "ความรัก ครอบครัว ความรับผิดชอบ ความลงตัว" },
    { d: "7", name: "เจ็ด", mean: "ปัญญา การเรียนรู้ จิตใจที่สงบ" },
    { d: "8", name: "แปด", mean: "ความร่ำรวย ความสำเร็จทางการเงิน ความก้าวหน้า" },
    { d: "9", name: "เก้า", mean: "ความยิ่งใหญ่ อำนาจ การได้รับการยอมรับ" }
  ],
  pairs: [
    { pair: "19", mean: "ก้าวหน้าในการงาน ได้รับการยอมรับ เป็นผู้นำ" },
    { pair: "28", mean: "การเงินมั่นคง ร่ำรวย มีโชคลาภ" },

// สร้างข้อความวิเคราะห์จากเบอร์ โดยใช้ตารางในหน้า "ตารางวิเคราะห์เบอร์"
function analysisText(number) {
  const R = settings.luckyRules || DEFAULT_LUCKY_RULES;
  const digitMap = {};
  R.digits.forEach(x => { digitMap[x.d] = x; });
  const pairMap = {};
  R.pairs.forEach(x => { if (x.pair) pairMap[x.pair] = x.mean; });
  const fitMap = {};
  R.fit.forEach(x => { fitMap[x.n] = x; });

  const digits = String(number || "").replace(/\D/g, "");
  if (!digits) return "";

  const sum = [...digits].reduce((a, d) => a + Number(d), 0);
  let root = sum;
  while (root > 9) root = String(root).split("").reduce((a, d) => a + Number(d), 0);
  const key = String(root || 9);

  const counts = {};
  [...digits].forEach(d => { counts[d] = (counts[d] || 0) + 1; });
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a - b)[0];

  const pairs = [];
  for (let i = 0; i < digits.length - 1; i++) {
    const pr = digits.slice(i, i + 2);
    if (pairMap[pr] && !pairs.includes(pr)) pairs.push(pr);
  }

  const fit = fitMap[key] || { who: "-", job: "-", boost: "-" };
  const topInfo = digitMap[top] || { name: "", mean: "" };

  const lines = [
    `ผลรวมตัวเลข ${sum} → ${key}`,
    `เลขเด่นที่สุด: ${top} (${topInfo.name}) ${counts[top]} ตัว — ${topInfo.mean}`,
    `เหมาะกับ: ${fit.who}`,
    `อาชีพที่เหมาะ: ${fit.job}`,
    `ส่งเสริมเรื่อง: ${fit.boost}`,
    pairs.length
      ? `เลขคู่มงคลที่พบ: ${pairs.map(p => `${p} (${pairMap[p]})`).join(", ")}`
      : "เลขคู่มงคลที่พบ: ไม่พบในเบอร์นี้"
  ];
  if (digits.includes("4")) lines.push("⚠️ มีเลข 4 ซึ่งบางตำราถือว่าไม่เป็นมงคล");
  lines.push("หมายเหตุ: เป็นการวิเคราะห์ตามความเชื่อเลขศาสตร์ ไม่ใช่ข้อเท็จจริงทางวิทยาศาสตร์");
  return lines.join("\n");
}

let lastAddedPkg = null;

function upd(key, i, field, val) {
  settings[key][i][field] = val;
  markDirty();
}

function addPkg(month2 = false, simAge = false) {
  const id = "P" + Date.now().toString(36);
  settings.PACKAGES.push({
    id, name: "", speed: "", desc: "",
    price: 0, code: "", badge: "", color: simAge ? "#0ea5e9" : (month2 ? "#7c3aed" : "#0b5ed7"), features: [],
    month2: !!month2 && !simAge, simAge: !!simAge, carrier: pkgTab
  });
  lastAddedPkg = id;
  markDirty();
  render();
}

function setShopVisible(i, on) {
  settings.PACKAGES[i].shopVisible = !!on;
  markDirty();
  render();
}

function setMonth2(i, on) {
  settings.PACKAGES[i].month2 = !!on;
  settings.PACKAGES[i].color = settings.PACKAGES[i].color || (on ? "#7c3aed" : "#0b5ed7");
  markDirty();
  render();
}

function setDiscType(i, type) {
  settings.PACKAGES[i].discType = type;
  markDirty();
  render();
}

function setFeatures(i, text) {
  settings.PACKAGES[i].features = text.split("\n").map(s => s.trim()).filter(Boolean);
  markDirty();
}

function delPkg(i) {
  if (!confirm("ลบแพ็กเกจนี้?")) return;
  settings.PACKAGES.splice(i, 1);
  markDirty(); saveAll();
  render();
}

function setSteps(text) {
  const lines = text.split("\n").map(x => x.trim()).filter(Boolean);
  if (pkgTab === "truemove H") settings.SELF_STEPS = lines;
  else settings.SELF_STEPS_BY = { ...(settings.SELF_STEPS_BY || {}), [pkgTab]: lines };
  markDirty();
}

function qrImg() {
  return settings.QR_IMAGE_URL ? `<img src="${esc(settings.QR_IMAGE_URL)}" alt="">` : "ยังไม่มี QR";
}

function setQR(url) {
  settings.QR_IMAGE_URL = url;
  markDirty();
  $("qrPreview").innerHTML = qrImg();
}

async function uploadQR(file) {
  if (!file) return;
  try {
    settings.QR_IMAGE_URL = await uploadFile(file);
    markDirty(); saveAll();
    render();
    toast("อัปโหลด QR แล้ว");
  } catch (e) {
    toast("อัปโหลด QR ไม่สำเร็จ", false);
  }
}

/* ==========================================================
   รายการสั่งซื้อ (สถิติ + จัดการสถานะ)
   ========================================================== */
async function loadOrders(silent = false) {
  if (!silent && tab === "orders") $("content").innerHTML = `<div class="card">กำลังโหลด...</div>`;
  try {
    orders = await api("/admin/orders");
  } catch (e) {
    orders = [];
    if (!silent) toast("โหลดรายการไม่สำเร็จ: " + e.message, false);
  }
  render();
}

// รีเฟรชรายการคำสั่งซื้ออัตโนมัติทุก 15 วินาที (เฉพาะตอนเปิดหน้ารายการคำสั่งซื้ออยู่)
let lastOrdersJson = "";
let portPending = false; // ร้านกำลังติ๊กแพ็กเกจแต่ยังไม่ได้กดส่ง ห้ามรีเฟรชทับ

async function autoRefreshOrders() {
  if (tab !== "orders") return;
  // ไม่รีเฟรชตอนกำลังพิมพ์ค้นหาหรือกำลังติ๊กแพ็กเกจที่ยังไม่ได้ส่ง
  const el = document.activeElement;
  if (el && ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
  if (portPending) return;
  let data;
  try {
    data = await api("/admin/orders");
  } catch (e) {
    return;
  }
  const json = JSON.stringify(data);
  if (json === lastOrdersJson) return;
  lastOrdersJson = json;
  orders = data;
  const inp = document.querySelector('input[oninput^="filterOrders"]');
  const q = inp ? inp.value : "";
  render();
  if (q) {
    const again = document.querySelector('input[oninput^="filterOrders"]');
    if (again) again.value = q;
    filterOrders(q);
  }
}
setInterval(autoRefreshOrders, 15000);

function viewOrders() {
  const today = new Date().toDateString();
  const now = new Date();
  const monthList = orders.filter(o => dayOf(o).getMonth() === now.getMonth() && dayOf(o).getFullYear() === now.getFullYear());
  const todayN = orders.filter(o => dayOf(o).toDateString() === today).length;
  const pending = orders.filter(o => o.status === "new").length;
  const revenue = monthList.reduce((s, o) => s + (Number(o.amount) || 0), 0);

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push({
      label: d.toLocaleDateString("th-TH", { weekday: "short" }),
      n: orders.filter(o => dayOf(o).toDateString() === d.toDateString()).length
    });
  }
  const max = Math.max(1, ...days.map(d => d.n));

  const branches = [["K", "กาฬสินธุ์"], ["L", "เลย"]].map(([code, name]) => {
    const bo = orders.filter(o => o.branch === code);
    const td = bo.filter(o => dayOf(o).toDateString() === today).length;
    const mo = bo.filter(o => dayOf(o).getMonth() === now.getMonth());
    const rev = mo.reduce((s, o) => s + (Number(o.amount) || 0), 0);
    return `<div class="branch"><b>🏪 ${code} — ${name}</b><span>วันนี้ ${td} · เดือนนี้ ${mo.length} · ${fmt(rev)}</span></div>`;
  }).join("");

  return `
    <div class="stats">
      <div class="stat"><div class="k">📅 วันนี้</div><div class="v">${todayN} <small>คำสั่ง</small></div></div>
      <div class="stat"><div class="k">📆 เดือนนี้</div><div class="v">${monthList.length} <small>คำสั่ง</small></div></div>
      <div class="stat"><div class="k">🎯 รอตรวจ</div><div class="v">${pending} <small>รายการ</small></div></div>
      <div class="stat"><div class="k">📈 ยอดเดือนนี้</div><div class="v">${fmt(revenue)}</div></div>
    </div>

    <div class="card">
      <div class="head"><h3>📊 7 วันย้อนหลัง</h3><button class="ghost" onclick="loadOrders()">🔄 รีเฟรช</button></div>
      <div class="bars">
        ${days.map(d => `<div class="b"><i style="height:${(d.n / max) * 100}%"><b>${d.n}</b></i>${d.label}</div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="head"><h3>รายการคำสั่งซื้อ (${orders.length})</h3></div>
      <input placeholder="ค้นหาเลขคำสั่งซื้อ เบอร์ หรือซีเรียลซิม" oninput="filterOrders(this.value)" style="margin-bottom:12px">
      <div id="orderGroups">${categorySections(orders)}</div>
    </div>`;
}

function filterOrders(q) {
  q = q.trim().toLowerCase();
  const list = !q ? orders : orders.filter(o =>
    [o.orderNo, o.phone, o.serial].some(v => String(v || "").toLowerCase().includes(q)));
  $("orderGroups").innerHTML = categorySections(list);
}

// แยกหมวดคำสั่งซื้อ: เบอร์ใหม / ต่อแพ็กเกจเดือนที่ 2 / สมัครแพ็กเกจเบอร์เดิม
function orderCategory(o) {
  const sh = o.shipping || {};
  if (sh.port || sh.simAge) return "port";
  if (sh.confirmImg) return "month2";
  return "new";
}

// เมนูย่อยของรายการคำสั่งซื้อ: 1) เบอร์ใหม่ 2) ต่อแพ็กเกจเดือนที่ 2 3) สมัครแพ็กเกจเบอร์เดิม
let orderTab = "new";
const ORDER_GROUPS = [
  ["new", "1. สมัครเน็ตเบอร์ใหม่", "ลงทะเบียนซิมและสมัครเน็ตเบอร์ใหม่"],
  ["month2", "2. ต่อแพ็กเกจเดือนที่ 2", "ลูกค้าต่อแพ็กเกจเดือนที่ 2 (มีรูปยืนยันเบอร์)"],
  ["port", "3. สมัครแพ็กเกจเบอร์เดิม", "เมนูโปรเน็ตเบอร์เดิม (OTP และการเลือกแพ็กเกจ)"]
];

function setOrderTab(k) {
  orderTab = k;
  const q = (document.querySelector('input[oninput^="filterOrders"]') || {}).value || "";
  filterOrders(q);
}

function categorySections(list) {
  const tabs = ORDER_GROUPS.map(([key, title]) => {
    const n = list.filter(o => orderCategory(o) === key).length;
    return `<button class="${orderTab === key ? "primary" : "ghost"}" onclick="setOrderTab('${key}')">${title} (${n})</button>`;
  }).join("");
  const [key, title, hint] = ORDER_GROUPS.find(g => g[0] === orderTab) || ORDER_GROUPS[0];
  const rows = list.filter(o => orderCategory(o) === key);
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${tabs}</div>
    <div class="order-group">
      <div class="head"><h3>${title} <small style="color:var(--muted);font-weight:500">(${rows.length})</small></h3></div>
      <p class="hint">${hint}</p>
      <div id="orderList_${key}">${orderListHTML(rows)}</div>
    </div>`;
}

function categorySections_old(list) {
  const groups = [
    ["new", "🆕 คำสั่งซื้อเบอร์ใหม่", "ลงทะเบียนซิมและสมัครเน็ตเบอร์ใหม่"],
    ["month2", "🔁 คำสั่งซื้อต่อแพ็กเกจเดือนที่ 2", "ลูกค้าต่อแพ็กเกจเดือนที่ 2 (มีรูปยืนยันเบอร์)"],
    ["port", "📞 คำสั่งซื้อสมัครแพ็กเกจเบอร์เดิม", "เมนูโปรเน็ตเบอร์เดิม (OTP และการเลือกแพ็กเกจ)"]
  ];
  return groups.map(([key, title, hint]) => {
    const rows = list.filter(o => orderCategory(o) === key);
    return `
      <div class="order-group" style="margin-top:16px">
        <div class="head"><h3>${title} <small style="color:var(--muted);font-weight:500">(${rows.length})</small></h3></div>
        <p class="hint">${hint}</p>
        <div id="orderList_${key}">${orderListHTML(rows)}</div>
      </div>`;
  }).join("");
}

  const label = { new: "รอตรวจ", confirmed: "ยืนยันแล้ว", done: "สมัครแล้ว", rejected: "ปฏิเสธ" };
  return list.map(o => (o.shipping && o.shipping.port) ? portOrderHTML(o) : `
    <div class="order">
      <div class="top2">
        <div>
          <b>#${esc(o.orderNo || o.id)}</b> · ${esc(pkgName(o))}
          <div class="meta">SIM ${esc(o.phone)}${o.serial ? ` · ซีเรียล ${esc(o.serial)}` : ""} · ${fmt(o.amount)}</div>
          <div class="meta">${dayOf(o).toLocaleString("th-TH")}</div>
          ${o.shipping && o.shipping.carrier && !o.shipping.confirmImg ? `<div class="meta">📶 เครือข่าย: ${esc(o.shipping.carrier)}</div>` : ""}
          ${o.shipping && o.shipping.confirmImg ? `
          <div style="margin-top:8px;padding:10px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;line-height:1.6">
            <b>📶 ต่อแพ็กเกจเดือนที่ 2</b> · ซิม ${esc(o.shipping.carrier || "-")} · เบอร์ ${esc(o.shipping.phone || o.phone || "-")}<br>
            <a href="${esc(o.shipping.confirmImg)}" target="_blank" rel="noopener" style="color:#0b5ed7;font-weight:700">🖼️ เปิดรูปยืนยันเบอร์</a>
          </div>` : ""}
          ${o.shipping && o.shipping.name ? `
          <div style="margin-top:8px;padding:10px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;line-height:1.6">
            <b>📦 ส่งถึง:</b> ${esc(o.shipping.name)} · ${esc(o.shipping.phone)}<br>
            ${esc([o.shipping.addr1, o.shipping.road, o.shipping.sub && "ต." + o.shipping.sub, o.shipping.dist && "อ." + o.shipping.dist, o.shipping.prov, o.shipping.zip].filter(Boolean).join(" "))}
            ${o.shipping.note ? `<br><span style="color:#64748b">หมายเหตุ: ${esc(o.shipping.note)}</span>` : ""}

        </div>

      </div>
      <div class="btns">
        <button class="primary" onclick="setOrder('${esc(o.id)}','confirmed')">ยืนยันแพ็กเกจ</button>

             <button class="ghost" onclick="messageCustomer('${esc(o.id)}')">💬 พิมพ์ข้อความเอง</button>`
          : `<span class="meta">ลูกค้าไม่ได้เปิดจากแอป LINE จึงส่งข้อความไม่ได้ ติดต่อทางเบอร์โทรแทน</span>`}
      </div>
    </div>`).join("");
}

].join("\n");

function fillTemplate(tpl, o) {
  return String(tpl || "")
    .replaceAll("{orderNo}", o.orderNo || o.id || "")
    .replaceAll("{pkgName}", pkgName(o))
    .replaceAll("{simPhone}", o.phone || "");
}

async function sendSteps(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  const text = fillTemplate(settings.messages?.steps ?? STEPS_TEMPLATE, o);
  if (!confirm("ส่งขั้นตอนหลังชำระเงินให้ลูกค้าคนนี้ทาง LINE?")) return;
  try {
    await api("/admin/orders/" + encodeURIComponent(id) + "/message", { method: "POST", json: { text } });
    toast("ส่งขั้นตอนให้ลูกค้าแล้ว");
  } catch (e) {
    toast("ส่งไม่สำเร็จ: " + e.message, false);
  }
}

async function messageCustomer(id) {
  const text = prompt("พิมพ์ข้อความที่จะส่งให้ลูกค้า (เช่น แจ้งปัญหาแพ็กเกจ หรือขอข้อมูลเพิ่ม)");
  if (!text || !text.trim()) return;
  try {
    await api("/admin/orders/" + encodeURIComponent(id) + "/message", { method: "POST", json: { text } });
    toast("ส่งข้อความให้ลูกค้าแล้ว");
  } catch (e) {
    toast("ส่งไม่สำเร็จ: " + e.message, false);
  }
}

async function setOrder(id, status) {
  try {
    await api("/admin/orders/" + encodeURIComponent(id), { method: "POST", json: { status } });
    const o = orders.find(x => x.id === id);
    if (o) o.status = status;
    render();
    toast("อัปเดตสถานะแล้ว");
  } catch (e) {
    toast("อัปเดตสถานะไม่สำเร็จ", false);
  }
}

// ย่อรูปที่ใหญ่เกิน 4 MB ก่อนอัพโหลด (เซิร์ฟเวอร์รับได้ไม่เกิน 5 MB) โดยให้ด้านยาวสุดไม่เกิน 1600 px
async function shrinkImage(file) {
  if (!file.type.startsWith("image/") || file.size <= 4 * 1024 * 1024) return file;
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error("อ่านรูปไม่ได้"));
      i.src = src;
    });
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
    if (!blob) throw new Error("ย่อรูปไม่ได้");
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } finally {
    URL.revokeObjectURL(src);
  }
}

// อัพโหลดรูปไปที่หลังบ้าน (คืนลิงก์รูป)
async function uploadFile(file) {
  const prepared = await shrinkImage(file);
  const fd = new FormData();
  fd.append("file", prepared, prepared.name);
  const r = await api("/admin/upload", { method: "POST", body: fd });
  return r.url;
}

async function portVerify(id) {
  try {
    await api("/admin/orders/" + encodeURIComponent(id) + "/port", { method: "POST", json: { action: "verify" } });
    const o = orders.find(x => x.id === id);
    if (o) o.status = "port_verified";
    render();
    toast("ยืนยัน OTP แล้ว เลือกแพ็กเกจได้เลย");
  } catch (e) {
    toast("ไม่สำเร็จ: " + e.message, false);
  }
}

async function portRetry(id) {
  if (!confirm("ขอ OTP ใหม่จากลูกค้าคนนี้? ลูกค้าจะต้องกรอก OTP ใหม่")) return;
  try {
    await api("/admin/orders/" + encodeURIComponent(id) + "/port", { method: "POST", json: { action: "retry" } });
    const o = orders.find(x => x.id === id);
    if (o) { o.status = "port_need_otp"; o.shipping = { ...(o.shipping || {}), otp: "", portPackageIds: [] }; }
    render();
    toast("ขอ OTP ใหม่แล้ว");
  } catch (e) {
    toast("ไม่สำเร็จ: " + e.message, false);
  }
}

async function assignPort(id) {
  const packageIds = [...document.querySelectorAll(`input[name="portPkg-${id}"]:checked`)].map(x => x.value);
  if (!packageIds.length) { toast("กรุณาเลือกแพ็กเกจอย่างน้อย 1 รายการ", false); return; }
  try {
    await api("/admin/orders/" + encodeURIComponent(id) + "/port", { method: "POST", json: { action: "send", packageIds } });
    const o = orders.find(x => x.id === id);
    portPending = false;
    if (o) { o.status = "port_ready"; o.shipping = { ...(o.shipping || {}), portPackageIds: packageIds }; }
    render();
    toast("ส่งแพ็กเกจให้ลูกค้าแล้ว (" + packageIds.length + " แพ็กเกจ)");
  } catch (e) {
    toast("ส่งไม่สำเร็จ: " + e.message, false);
  }

/* ==========================================================

   ========================================================== */
let couponList = [];
let couponCodes = "";   // รหัสชุดที่เพิ่งสร้าง ใช้แสดงให้คัดลอก
let couponLastBatch = "";  // ชื่อชุดที่เพิ่งสร้าง ใช้ลบได้ทันทีถ้าสร้างผิด
const COUPON_STATUS_LABEL = { unused: "ยังไม่ใช้", used: "ใช้แล้ว", void: "ยกเลิก", expired: "หมดอายุ" };
const fmtCouponCode = c => c.length > 5 ? c.slice(0, 5) + "-" + c.slice(5) : c;

function couponStatusOf(c) {
  if (c.status === "unused" && new Date(c.expiresAt) < new Date()) return "expired";
  return c.status;
}

async function loadCoupons() {
  try {
    couponList = await api("/admin/coupons");
  } catch (e) {
    couponList = [];
    toast("โหลดคูปองไม่สำเร็จ: " + e.message, false);
  }
  render();
}

async function createCouponBatch() {
  const count = Math.floor(Number($("cpCount").value));
  const days = Math.floor(Number($("cpDays").value));
  const amount = Math.floor(Number($("cpAmount").value));
  const batch = $("cpBatch").value.trim();
  if (!(count >= 1 && count <= 500)) { toast("จำนวนคูปองต้องอยู่ระหว่าง 1 - 500", false); return; }
  if (!(days >= 1 && days <= 730)) { toast("อายุคูปองต้องอยู่ระหว่าง 1 - 730 วัน", false); return; }
  if (!(amount >= 1 && amount <= 5000)) { toast("มูลค่าคูปองต้องอยู่ระหว่าง 1 - 5000 บาท", false); return; }
  try {
    const r = await api("/admin/coupons", { method: "POST", json: { count, days, batch, amount } });
    couponCodes = r.codes.map(fmtCouponCode).join("\n");
    couponLastBatch = r.batch || "";
    toast(`สร้างคูปอง ${r.codes.length} รหัสแล้ว`);
    await loadCoupons();
  } catch (e) {
    toast("สร้างคูปองไม่สำเร็จ: " + e.message, false);
  }
}

async function copyCouponCodes() {
  try {
    await navigator.clipboard.writeText(couponCodes);
    toast("คัดลอกรหัสแล้ว");
  } catch (e) {
    const box = $("cpOut");
    if (box) { box.select(); document.execCommand("copy"); }
    toast("คัดลอกรหัสแล้ว");
  }
}

// ลบคูปองที่ยังไม่ใช้ทั้งชุด (ใช้ตอนสร้างผิดหรือจะสร้างใหม่) คูปองที่ใช้แล้วจะไม่ถูกลบ
async function removeCouponBatch(name) {
  const unused = couponList.filter(c => (c.batch || "-") === name && couponStatusOf(c) === "unused").length;
  if (!unused) { toast("ไม่มีคูปองที่ยังไม่ใช้ในชุดนี้", false); return; }
  if (!confirm(`ลบคูปองที่ยังไม่ใช้ ${unused} ใบในชุด "${name}" ?\n(คูปองที่ใช้ไปแล้วจะไม่ถูกลบ)`)) return;
  try {
    const r = await api("/admin/coupons/delete-batch", { method: "POST", json: { batch: name } });
    if (couponLastBatch === name) { couponCodes = ""; couponLastBatch = ""; }
    toast(`ลบคูปองแล้ว ${r.deleted} ใบ`);
    await loadCoupons();
  } catch (e) {
    toast("ลบไม่สำเร็จ: " + e.message, false);
  }
}

async function voidCoupon(code) {
  if (!confirm("ยกเลิกคูปอง " + fmtCouponCode(code) + " ?")) return;
  try {
    await api("/admin/coupons/void", { method: "POST", json: { code } });
    toast("ยกเลิกคูปองแล้ว");
    await loadCoupons();
  } catch (e) {
    toast("ยกเลิกไม่สำเร็จ: " + e.message, false);
  }
}

let couponBatchNames = [];

  const map = {};
  couponList.forEach(c => {
    const b = c.batch || "-";
    map[b] = map[b] || { total: 0, unused: 0, used: 0, amount: c.amount };

/* ==========================================================
   สต๊อกซิม (เก็บใน Firebase ที่ path /stock_sim)
   ========================================================== */
const STOCK_FB = "https://simtracker-3a70d-default-rtdb.asia-southeast1.firebasedatabase.app";
const STOCK_PATH = "/stock_sim";
const STOCK_PROVINCE = { "10048452": "กาฬสินธุ์", "10049224": "เลย" };
const STOCK_PLATFORMS = ["Shopee", "TikTok", "Lazada", "หน้าร้าน", "อื่นๆ"];
let stockList = [];
let stockLoaded = false;
let stockSub = "list";
let stockFilter = "all";
let stockQ = "";
let stockSelected = "";
let stockPending = [];

const stockKey = s => String(s).replace(/[.#$\[\]\/\s]/g, "_");
const bkkDay = ts => new Date(ts).toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });

async function stockReq(path, method = "GET", data) {
  const res = await fetch(STOCK_FB + path + ".json", {
    method,
    headers: { "Content-Type": "application/json" },
    body: data === undefined ? undefined : JSON.stringify(data)
  });
  if (!res.ok) throw new Error("เชื่อมต่อฐานข้อมูลสต๊อกไม่ได้ (" + res.status + ")");
  return res.json().catch(() => null);
}

async function loadStock() {
  try {
    const d = await stockReq(STOCK_PATH);
    stockList = d && typeof d === "object" ? Object.values(d).filter(s => s && s.serial) : [];
    stockLoaded = true;
  } catch (e) {
    toast(e.message, false);
  }
  render();
}

async function stockSave(serial, patch) {
  const s = stockList.find(x => x.serial === serial);
  if (!s) return false;
  try {
    await stockReq(STOCK_PATH + "/" + stockKey(serial), "PATCH", patch);
    Object.assign(s, patch);
    return true;
  } catch (e) {
    toast(e.message, false);
    return false;
  }
}

function stockPick(serial, mode) { stockSelected = serial; stockSub = mode; render(); }
function stockSetSub(k) { stockSub = k; render(); }
function stockSetFilter(f) { stockFilter = f; render(); }
function stockSetQ(v) { stockQ = v; const el = document.getElementById("stockRows"); if (el) el.innerHTML = stockRowsHtml(); }

function stockMatch(s) {
  const f = stockFilter;
  if (f === "available" && (s.sold || s.simStatus !== "SUCCESS")) return false;
  if (f === "sold" && !s.sold) return false;
  if (f === "pending" && !(s.sold && !s.registered)) return false;
  if (f === "registered" && !s.registered) return false;
  if (f === "fail" && s.simStatus === "SUCCESS") return false;
  if (stockQ) {
    const q = stockQ.toLowerCase();
    return [s.serial, s.customerName, s.orderId, s.province].some(v => String(v || "").toLowerCase().includes(q));
  }
  return true;
}

function stockRowsHtml() {
  const rows = stockList.filter(stockMatch).sort((a, b) => (b.importedAt || 0) - (a.importedAt || 0)).slice(0, 300);
  if (!rows.length) return `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">ไม่พบข้อมูล</td></tr>`;
  return rows.map(s => {
    const st = s.registered ? `<span class="pill">ลงทะเบียนแล้ว</span>` : s.sold ? `<span class="pill new">รอลงทะเบียน</span>` : "-";
    return `<tr>
      <td><code>${esc(s.serial)}</code></td>
      <td>${esc(s.province || "-")}</td>
      <td>${esc(s.simStatus || "-")}</td>
      <td>${s.sold ? "ขายแล้ว" : "-"}</td>
      <td>${esc(s.customerName || "-")}</td>
      <td>${st}</td>
      <td style="white-space:nowrap">
        <button class="ghost" onclick="stockPick('${esc(s.serial)}','sell')">ขาย</button>
        <button class="ghost" onclick="stockPick('${esc(s.serial)}','reg')">ลงทะเบียน</button>
        <button class="danger" onclick="stockDelete('${esc(s.serial)}')">ลบ</button>
      </td>
    </tr>`;
  }).join("");
}

function stockListHtml() {
  const filters = [["all", "ทั้งหมด"], ["available", "พร้อมขาย"], ["sold", "ขายแล้ว"], ["pending", "รอลงทะเบียน"], ["registered", "ลงทะเบียนแล้ว"], ["fail", "FAIL ทรู"]];
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${filters.map(([k, l]) => `<button class="${stockFilter === k ? "primary" : "ghost"}" onclick="stockSetFilter('${k}')">${l}</button>`).join("")}
    </div>
    <input placeholder="ค้นหา Serial / ชื่อ / Order ID / จังหวัด" value="${esc(stockQ)}" oninput="stockSetQ(this.value)" style="margin-bottom:10px">
    <div class="table-wrap"><table>
      <thead><tr><th>Serial</th><th>จังหวัด</th><th>สถานะทรู</th><th>ขาย</th><th>ลูกค้า</th><th>ลงทะเบียน</th><th></th></tr></thead>
      <tbody id="stockRows">${stockRowsHtml()}</tbody>
    </table></div>
    <div style="color:var(--muted);font-size:12px;margin-top:8px">ทั้งหมด ${stockList.length} ซิม (แสดงสูงสุด 300 รายการ)</div>`;
}

function stockSellHtml() {
  const avail = stockList.filter(s => !s.sold && s.simStatus === "SUCCESS").length;
  return `
    <div class="grid2">
      <div>
        <label>Serial ซิม (8966...)<input id="sSerial" value="${esc(stockSelected)}" placeholder="896604..."></label>
        <label>ช่องทางการขาย<select id="sPlatform">${STOCK_PLATFORMS.map(p => `<option>${p}</option>`).join("")}</select></label>
        <label>Order ID<input id="sOrder" placeholder="เช่น SPX240101..."></label>
        <label>ชื่อลูกค้า *<input id="sName"></label>
        <label>เบอร์โทร<input id="sPhone"></label>
        <div style="margin-top:12px"><button class="primary" onclick="stockSaveSell()">บันทึกการขาย</button></div>
      </div>
      <div style="color:var(--muted);font-size:13px">พร้อมขาย ${avail} ซิม<br>เลือกซิมจากแท็บ "รายการทั้งหมด" แล้วกด "ขาย" หรือพิมพ์ Serial ทางซ้าย</div>
    </div>`;
}

async function stockSaveSell() {
  const serial = document.getElementById("sSerial").value.replace(/\D/g, "");
  const name = document.getElementById("sName").value.trim();
  const s = stockList.find(x => x.serial === serial);
  if (!s) return toast("ไม่พบ Serial นี้ในสต๊อก", false);
  if (s.sold) return toast("ซิมนี้บันทึกขายแล้ว", false);
  if (!name) return toast("กรุณากรอกชื่อลูกค้า", false);
  const ok = await stockSave(serial, {
    sold: true,
    soldAt: Date.now(),
    platform: document.getElementById("sPlatform").value,
    orderId: document.getElementById("sOrder").value.trim(),
    customerName: name,
    customerPhone: document.getElementById("sPhone").value.trim()
  });
  if (ok) { toast("บันทึกการขายแล้ว"); stockSelected = ""; }
  render();
}

function stockRegHtml() {
  const waiting = stockList.filter(s => s.sold && !s.registered);
  const list = waiting.sort((a, b) => (b.soldAt || 0) - (a.soldAt || 0)).slice(0, 50);
  const rows = list.map(s => `<tr>
      <td><code>${esc(s.serial)}</code></td>
      <td>${esc(s.customerName || "-")}</td>
      <td><button class="ghost" onclick="stockPick('${esc(s.serial)}','reg')">เลือก</button></td>
    </tr>`).join("");
  return `
    <div class="grid2">
      <div>
        <label>Serial ซิม (8966...)<input id="rSerial" value="${esc(stockSelected)}" placeholder="896604..."></label>
        <label>เบอร์โทรที่ได้รับ (ถ้ามี)<input id="rPhone"></label>
        <div style="margin-top:12px"><button class="primary" onclick="stockSaveReg()">บันทึกการลงทะเบียน</button></div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:6px">รอลงทะเบียน (${waiting.length})</div>
        <div class="table-wrap" style="max-height:360px;overflow:auto"><table>
          <tbody>${rows || `<tr><td style="color:var(--muted);padding:12px">ไม่มีซิมที่รอลงทะเบียน</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

async function stockSaveReg() {
  const serial = document.getElementById("rSerial").value.replace(/\D/g, "");
  const s = stockList.find(x => x.serial === serial);
  if (!s) return toast("ไม่พบ Serial นี้ในสต๊อก", false);
  if (s.registered) return toast("ซิมนี้ลงทะเบียนแล้ว", false);
  const ok = await stockSave(serial, {
    registered: true,
    registeredAt: Date.now(),
    customerRegPhone: document.getElementById("rPhone").value.trim()
  });
  if (ok) { toast("บันทึกการลงทะเบียนแล้ว"); stockSelected = ""; }
  render();
}

async function stockDelete(serial) {
  if (!confirm("ลบซิม " + serial + " ออกจากสต๊อก?")) return;
  try {
    await stockReq(STOCK_PATH + "/" + stockKey(serial), "DELETE");
    stockList = stockList.filter(s => s.serial !== serial);
    toast("ลบแล้ว");
  } catch (e) {
    toast(e.message, false);
  }
  render();
}

function stockSumHtml() {
  const today = bkkDay(Date.now());
  const sold = stockList.filter(s => s.sold).length;
  const reg = stockList.filter(s => s.registered).length;
  const pend = stockList.filter(s => s.sold && !s.registered).length;
  const avail = stockList.filter(s => !s.sold && s.simStatus === "SUCCESS").length;
  const fail = stockList.filter(s => s.simStatus && s.simStatus !== "SUCCESS").length;
  const regToday = stockList.filter(s => s.registeredAt && bkkDay(s.registeredAt) === today);
  const provs = {};
  regToday.forEach(s => { const p = s.province || "ไม่ระบุ"; provs[p] = (provs[p] || 0) + 1; });
  const stat = (label, val) => `<div style="background:var(--bg);border-radius:10px;padding:12px;text-align:center"><div style="font-size:22px;font-weight:800">${val}</div><div style="color:var(--muted);font-size:12px">${label}</div></div>`;
  const provRows = Object.entries(provs).map(([p, c]) => `<tr><td>${esc(p)}</td><td style="text-align:right;font-weight:700">${c}</td></tr>`).join("");
  return `
    <div class="grid3" style="margin-bottom:14px">
      ${stat("ซิมทั้งหมด", stockList.length)}${stat("พร้อมขาย", avail)}${stat("ขายแล้ว", sold)}
      ${stat("ลงทะเบียนแล้ว", reg)}${stat("รอลงทะเบียน", pend)}${stat("FAIL ทรู", fail)}
    </div>
    <div style="font-weight:700;margin-bottom:6px">ลงทะเบียนวันนี้ (${regToday.length} ซิม)</div>
    ${provRows ? `<table><tbody>${provRows}</tbody></table>` : `<div style="color:var(--muted)">ยังไม่มีการลงทะเบียนวันนี้</div>`}`;
}

function stockImportHtml() {
  return `
    <label>ไฟล์ Excel จากทรู (.xls, .xlsx)<input type="file" accept=".xls,.xlsx" onchange="stockParseFile(this.files[0])"></label>
    <div id="stockImportMsg" style="margin-top:12px"></div>`;
}

function loadXlsx() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) return resolve();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("โหลดตัวอ่าน Excel ไม่ได้ ตรวจสอบอินเทอร์เน็ต"));
    document.head.appendChild(s);
  });
}

function stockMsg(html) {
  const el = document.getElementById("stockImportMsg");
  if (el) el.innerHTML = html;
}

async function stockParseFile(file) {
  if (!file) return;
  stockPending = [];
  stockMsg(`<span style="color:var(--muted)">กำลังอ่านไฟล์...</span>`);
  try {
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellText: true, raw: false });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
    let hi = rows.findIndex(r => r.some(c => /หมายเลข SIM|serial/i.test(String(c))));
    if (hi < 0) hi = 0;
    const header = rows[hi].map(h => String(h));
    const col = kws => { for (const kw of kws) { const i = header.findIndex(h => h.includes(kw)); if (i >= 0) return i; } return -1; };
    const cSerial = col(["หมายเลข SIM", "serial", "SIM"]);
    const cDate = col(["วันที่สแกน", "scan"]);
    const cPC = col(["รหัสพันธมิตร"]);
    const cPN = col(["ชื่อพันธมิตร"]);
    const cSt = col(["สถานะ", "status"]);
    const cRe = col(["เหตุผล", "reason"]);
    const cTy = col(["ประเภท"]);
    const val = (r, i) => (i >= 0 ? String(r[i] ?? "").trim() : "");
    const sims = rows.slice(hi + 1).map(r => {
      const serial = val(r, cSerial).replace(/\.0+$/, "").replace(/\s/g, "");
      const pc = val(r, cPC);
      return {
        serial, scanDate: val(r, cDate), partnerCode: pc, partnerName: val(r, cPN),
        province: STOCK_PROVINCE[pc] || "ไม่ระบุ", simStatus: val(r, cSt),
        failReason: val(r, cRe), simType: val(r, cTy),
        importedAt: Date.now(), sold: false, registered: false
      };
    }).filter(s => /^8966\d+$/.test(s.serial));
    if (!sims.length) return stockMsg(`<span style="color:var(--err)">ไม่พบซิม (8966...) ในไฟล์นี้</span>`);
    const existing = new Set(stockList.map(s => s.serial));
    const fresh = sims.filter(s => !existing.has(s.serial));
    stockPending = fresh;
    stockMsg(`พบซิม ${sims.length} รายการ · ใหม่ ${fresh.length} · มีอยู่แล้ว ${sims.length - fresh.length}` +
      (fresh.length ? `<div style="margin-top:10px"><button class="primary" onclick="stockConfirmImport()">นำเข้า ${fresh.length} ซิม</button></div>` : ""));
  } catch (e) {
    stockMsg(`<span style="color:var(--err)">อ่านไฟล์ไม่ได้: ${esc(e.message)}</span>`);
  }
}

async function stockConfirmImport() {
  const list = stockPending;
  if (!list.length) return;
  try {
    for (let i = 0; i < list.length; i += 300) {
      const part = {};
      list.slice(i, i + 300).forEach(s => { part[stockKey(s.serial)] = s; });
      await stockReq(STOCK_PATH, "PATCH", part);
    }
    stockList = stockList.concat(list);
    stockPending = [];
    stockSub = "list";
    toast("นำเข้า " + list.length + " ซิมแล้ว");
  } catch (e) {
    toast(e.message, false);
  }
  render();
}

function viewStock() {
  if (!stockLoaded) return `<div class="card">กำลังโหลดข้อมูลสต๊อก...</div>`;
  const subs = [["list", "รายการทั้งหมด"], ["sell", "บันทึกขาย"], ["reg", "ลงทะเบียน"], ["sum", "สรุปยอด"], ["import", "นำเข้า Excel"]];
  const bodies = { list: stockListHtml, sell: stockSellHtml, reg: stockRegHtml, sum: stockSumHtml, import: stockImportHtml };
  return `<div class="card">
    <div class="head"><h3>สต๊อกซิม</h3><button class="ghost" onclick="loadStock()">โหลดข้อมูลใหม่</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${subs.map(([k, l]) => `<button class="${stockSub === k ? "primary" : "ghost"}" onclick="stockSetSub('${k}')">${l}</button>`).join("")}
    </div>
    ${bodies[stockSub]()}
  </div>`;
}
